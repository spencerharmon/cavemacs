name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        emacs_version: ['30.1', '30.2', 'snapshot']
    steps:
      - uses: actions/checkout@v4
      - uses: purcell/setup-emacs@master
        with:
          version: ${{ matrix.emacs_version }}
      - name: Install markdown-mode
        run: |
          mkdir -p ~/.emacs.d/elpa
          emacs --batch \
            --eval "(require 'package)" \
            --eval "(add-to-list 'package-archives '(\"melpa\" . \"https://melpa.org/packages/\") t)" \
            --eval "(package-initialize)" \
            --eval "(package-refresh-contents)" \
            --eval "(package-install 'markdown-mode)"
      - name: Byte-compile
        run: |
          emacs --batch -L . \
            --eval "(setq byte-compile-error-on-warn nil)" \
            --eval "(package-initialize)" \
            --eval "(dolist (f (directory-files \".\" t \"^cavemacs.*\\\\.el$\")) (byte-compile-file f))"
      - name: Run unit tests
        run: |
          emacs --batch -L . \
            --eval "(package-initialize)" \
            -l tests/cavemacs-rpc-test.el \
            -l tests/cavemacs-render-test.el \
            -f ert-run-tests-batch-and-exit
      # Integration test requires `caveman` + authenticated provider;
      # not run in CI.  Run locally with:
      #   emacs --batch -L . -l tests/cavemacs-integration-test.el \
      #         -f ert-run-tests-batch-and-exit
